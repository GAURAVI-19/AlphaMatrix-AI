version: '3.8'

services:
  # --- MONGO DATABASE NODE ---
  mongodb:
    image: mongo:6.0
    container_name: alphamatrix_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- REDIS CACHING NODE ---
  redis:
    image: redis:7-alpine
    container_name: alphamatrix_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- ENTERPRISE BACKEND API ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alphamatrix_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/alphamatrix
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretjwtkeyforalphamatrixproduction
      - JWT_REFRESH_SECRET=anotherrefreshsupersecretjwtkeyforalphamatrixproduction
      - CORS_ORIGIN=http://localhost
      - NODE_ENV=production
      - LOG_LEVEL=info
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=200
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- HIGH ACCURACY FRONTEND NGINX ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alphamatrix_frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
